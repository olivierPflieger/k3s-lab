apiVersion: apps/v1
kind: Deployment
metadata:
  name: video29-2-deploy
  namespace: k3s-namespace
spec:
  replicas: 1
  selector: 
    matchLabels: 
       app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec :
      containers:
        - name: video29-2-pod-postgres
          image: postgres:latest
          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "testdb"
          ports: 
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      volumes:
        - name: postgres-data
          hostPath:
            path: /data/postgres
            type: DirectoryOrCreate
