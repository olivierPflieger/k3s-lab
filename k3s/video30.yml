apiVersion: v1
kind: Pod
metadata:
  name: video30-pod
spec:
  containers:
    - image: nginx
      name: nginx
      volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: html
  volumes:
    - name: html
      nfs:
        server: 192.168.100.40
        path: /srv/nfs/k3s-shared
