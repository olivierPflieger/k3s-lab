apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp-probe-deploy-db
  namespace: k3s-namespace
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: tp-probe-db
  template:
    metadata:
      labels:
        app: tp-probe-db
    spec:
      containers:
      - name: tp-probe-db-pod
        image: postgres:18.6
#        command: ["/bin/sh", "-c"]
#        args:
#          - "sleep 60 && exec docker-entrypoint.sh postgres"
        env: 
          - name: POSTGRES_USER
            value: "admin"
          - name: POSTGRES_PASSWORD
            value: "admin"
          - name: POSTGRES_DB
            value: "testdb"
        ports:
          - containerPort: 5432
        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: tp-probe-pvc-db
