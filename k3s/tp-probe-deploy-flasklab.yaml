apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp-probe-deploy-flasklab
  namespace: k3s-namespace
spec:
  replicas: 3
  selector: 
    matchLabels:
      app: tp-probe-flasklab
  template:
    metadata:
      labels:
        app: tp-probe-flasklab
    spec:
      containers:
      - name: tp-probe-flasklab-pod
        image: flask-lab:1.3
        ports:
        - containerPort: 5000
        imagePullPolicy: IfNotPresent
        env:
          - name: DB_HOST
            value: tp-probe-svc-db 
          - name: DB_USER
            value: "admin"
          - name: DB_PASSWORD
            value: "admin"
          - name: DB_NAME
            value: "testdb"
        readinessProbe:
          httpGet: 
            path: /health
            port: 5000
          periodSeconds: 1
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 2
