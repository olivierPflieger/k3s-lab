apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp-probe-deploy-flasklab
  namespace: k3s-namespace
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: tp-probe-flasklab
  template:
    metadata:
      labels:
        app: tp-probe-flasklab
    spec:
      containers:
      - name: tp-probe-flasklab-pod
        image: flask-lab:1.1
        ports:
        - containerPort: 5000
        imagePullPolicy: IfNotPresent
        env:
          - name: DB_HOST
            value: tp-probe-svc-db 
          - name: DB_USER
            value: "admin"
          - name: DB_PASSWORD
            value: "admin"
          - name: DB_NAME
            value: "testdb"
