apiVersion: v1
kind: Pod
metadata:
  name: video29
  namespace: k3s-namespace
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - mountPath: /usr/share/host-data
          name: host-volume
  volumes:
    - name: host-volume
      hostPath:
        path: /data
        type: DirectoryOrCreate
