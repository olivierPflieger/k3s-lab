apiVersion: apps/v1
kind: Deployment
metadata:
  name: video37-cluster-deploy-podaffinity-backend
  namespace: k3s-namespace
  labels:
    app: backend
spec:
  replicas: 5
  selector: 
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: nginx:latest
        ports:
        - containerPort: 80
        imagePullPolicy: IfNotPresent
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: environment
                    operator: In
                    values: 
                      - prod
